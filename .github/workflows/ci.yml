name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/sorobill?schema=public
      REDIS_URL: redis://localhost:6379
      STELLAR_TREASURY_SECRET_KEY: SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      TEST_MODE: "true"
      PORT: "3001"
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'prisma/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vitest.config.*'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: "20"
          cache: npm

      - name: Install
        if: steps.filter.outputs.code == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: steps.filter.outputs.code == 'true'
        run: npx prisma generate

      - name: Test
        if: steps.filter.outputs.code == 'true'
        run: npm test

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: npm run build

      - name: Docs and metadata only
        if: steps.filter.outputs.code != 'true'
        run: echo "No API paths changed; unit verification skipped."
